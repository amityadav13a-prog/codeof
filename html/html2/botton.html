<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<botton>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style> 
        .sub-but{
            background-color: rgb(200, 0, 0);
            color: white;
            border: none;
            height: 34px;
            width: 105px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 8px;
        }
        .sub-but:hover{
            opacity:0.8;
        }
        .sub-but:active{ opacity:0.5;}
        .join-button{
            background-color: white;
            color: rgb(12, 54, 244);
            border-color: rgba(3, 3, 245, 0.855);
            border-style:solid;
            border-width:1px;
            height: 34px;
            width: 62px;
            border-radius: 2px;
            cursor: pointer;
        }
        .join-button:hover{
            background-color: blue;
            color: black;
        }
        .sub-but:active{ opacity:0.5;}
        .tweet-button{
             background-color: rgb(22, 76, 238);
            color: white;
            border-color: white;
            border-style:solid;
            border-width:1px;
            height: 34px;
            width: 72px;
            border-radius: 25px;
            cursor: pointer;
            margin-left: 8px;
        }
    </style>
   <button class="sub-but">subscribe  </button> 
   <button class="join-button"> join </button>
   <button class="tweet-button"> tweet </button>
</body>
</html>
